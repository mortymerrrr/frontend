server {
    listen 80;
    server_name localhost;

    # Раздача статики
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Проксирование запросов к backend
    location /submit {
        proxy_pass http://backend:5000/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /read {
        proxy_pass http://backend:5000/read;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
